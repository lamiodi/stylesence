  animation: ss-signature 1250ms cubic-bezier(.22, .72, .18, 1) both;
}
#ss-preloader-preview .ss-loader__logo{
  display: block;
  width: 100%;
  height: auto;
  mix-blend-mode: multiply;
}
#ss-preloader-preview .ss-loader__caption{
  margin-top: 28px;
  padding-left: .22em;
  font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .22em;
  line-height: 1.5;
  text-align: center;
  color: #665e54;
  animation: ss-caption 900ms 500ms both;
}
#ss-preloader-preview .ss-loader__line{
  position: relative;
  width: 92px;
  height: 1px;
  margin-top: 28px;
  overflow: hidden;
  background: rgb(34 30 26 / 13%);
  animation: ss-caption 700ms 750ms both;
}
#ss-preloader-preview .ss-loader__line > span{
  position: absolute;
  inset: 0;
  background: var(--ss-ink);
  transform: translateX(-105%);
  animation: ss-thread 1700ms 700ms cubic-bezier(.6, .05, .35, 1) infinite;
}
#ss-preloader-preview .ss-loader__foot{
  position: absolute;
  bottom: max(24px, env(safe-area-inset-bottom));
  left: max(24px, env(safe-area-inset-left));
  right: max(24px, env(safe-area-inset-right));
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: #746c62;
  font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .14em;
  line-height: 1.5;
  animation: ss-caption 1000ms 100ms both;
}
#ss-preloader-preview .ss-loader--leaving{
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
#ss-preloader-preview .ss-loader--leaving .ss-loader__content{ transform: translateY(-20px); }
@keyframes ss-signature{
  from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateY(8px); }
  20% { opacity: 1; }
  to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); }
}
@keyframes ss-caption{
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ss-thread{
  0% { transform: translateX(-105%); }
  50% { transform: translateX(0); }
  100% { transform: translateX(105%); }
}
@media (prefers-reduced-motion: reduce){#ss-preloader-preview .ss-loader{ transition-duration: 160ms; }
#ss-preloader-preview .ss-loader__content, #ss-preloader-preview .ss-loader--leaving .ss-loader__content{ transform: none; transition: none; }
#ss-preloader-preview .ss-loader__signature, #ss-preloader-preview .ss-loader__caption, #ss-preloader-preview .ss-loader__line, #ss-preloader-preview .ss-loader__foot{ animation: none; opacity: 1; clip-path: none; transform: none; }
#ss-preloader-preview .ss-loader__line > span{ animation: none; transform: none; opacity: .5; }

}


#ss-preloader-preview { width: 100%; color-scheme: light dark; }
#ss-preloader-preview * { box-sizing: border-box; }
#ss-preloader-preview .ss-demo-surface { position: relative; height: 420px; overflow: hidden; background: #f8f4ec; color: #221e1a; }
#ss-preloader-preview .ss-loader { position: absolute; z-index: 2; }
#ss-preloader-preview .ss-demo-page { height: 100%; opacity: 0; transform: translateY(8px); transition: opacity 800ms ease, transform 950ms cubic-bezier(.22,1,.36,1); }
#ss-preloader-preview[data-state="revealed"] .ss-demo-page { opacity: 1; transform: none; }
#ss-preloader-preview .ss-demo-header { padding: 24px; text-align: center; font: 400 18px/1.25 Georgia, serif; letter-spacing: .3em; border-bottom: 1px solid rgb(34 30 26 / 9%); }
#ss-preloader-preview .ss-demo-header span { display: block; padding-left: .3em; margin-top: 6px; font: 400 11px/1.5 ui-monospace, monospace; letter-spacing: .3em; }
#ss-preloader-preview .ss-demo-editorial { position: absolute; top: 51%; left: 24px; right: 24px; transform: translateY(-40%); text-align: center; }
#ss-preloader-preview .ss-demo-editorial p { margin: 0 0 16px; font: 400 11px/1.5 ui-monospace, monospace; letter-spacing: .2em; color: #665e54; }
#ss-preloader-preview .ss-demo-editorial h2 { margin: 0 0 16px; font: 400 clamp(34px, 5.5vw, 48px)/1.06 Georgia, serif; letter-spacing: -.03em; }
#ss-preloader-preview .ss-demo-editorial > span { font: 400 13px/1.5 Arial, sans-serif; color: #665e54; }
#ss-preloader-preview .ss-demo-baseline { position: absolute; bottom: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; gap: 12px; font: 400 11px/1.5 ui-monospace, monospace; letter-spacing: .1em; color: #746c62; }
#ss-preloader-preview .ss-demo-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 12px 0; font: 400 12px/1.5 system-ui, sans-serif; color: light-dark(#665e54, #c8c3bb); }
#ss-preloader-preview .ss-demo-tools button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 12px; border: 1px solid light-dark(#d2cdc4, #55514d); border-radius: 4px; background: light-dark(#f8f4ec, #292521); color: light-dark(#221e1a, #f8f4ec); font: 400 12px/1.5 system-ui, sans-serif; }
#ss-preloader-preview .ss-demo-tools button:disabled { opacity: .5; }
#ss-preloader-preview .ss-demo-tools button span { font-size: 18px; }
#ss-preloader-preview .ss-demo-status { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 380px) {
  #ss-preloader-preview .ss-demo-surface { height: 370px; }
  #ss-preloader-preview .ss-loader__caption { font-size: 11px; letter-spacing: .16em; }
  #ss-preloader-preview .ss-loader__foot, #ss-preloader-preview .ss-demo-baseline { left: 18px; right: 18px; font-size: 11px; }
}
@media (pointer: coarse) { #ss-preloader-preview .ss-demo-tools button { min-height: 44px; } }
@media (prefers-reduced-motion: reduce) {
  #ss-preloader-preview .ss-demo-page { transform: none; transition: opacity 160ms; }
}
</style>
<script>
(() => {
  const root = document.getElementById('ss-preloader-preview');
  if (!root) return;
  const stage = root.querySelector('.ss-demo-surface');
  const button = root.querySelector('button');
  const status = root.querySelector('.ss-demo-status');
  const template = root.querySelector('template');
  let readyTimer;
  let exitTimer;
  function play() {
    window.clearTimeout(readyTimer);
    window.clearTimeout(exitTimer);
    stage.querySelector('.ss-loader')?.remove();
    root.dataset.state = 'loading';
    button.disabled = true;
    status.textContent = 'Preview playing';
    const loader = template.content.firstElementChild.cloneNode(true);
    stage.appendChild(loader);
    readyTimer = window.setTimeout(() => {
      root.dataset.state = 'revealed';
      loader.classList.add('ss-loader--leaving');
      const duration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 180 : 540;
      exitTimer = window.setTimeout(() => {
        loader.remove();
        button.disabled = false;
        status.textContent = 'Preview complete';
      }, duration);
    }, 2300);
  }
  button.addEventListener('click', play);
  play();
})();
</script>

</body></html>
